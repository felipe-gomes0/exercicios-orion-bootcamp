services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: ex01-orion-bootcamp:latest
    ports:
      - "3000:3000"
    volumes:
      - ./:/usr/src/app
      - /usr/src/app/node_modules
    command: npm start
    environment:
      - NODE_ENV=development
      - PORT=3000
    restart: unless-stopped